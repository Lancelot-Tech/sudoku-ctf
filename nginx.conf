# Rate limiting zones
limit_req_zone $binary_remote_addr zone=api:20m    rate=30r/s;
limit_req_zone $binary_remote_addr zone=start:10m  rate=5r/m;
limit_req_zone $binary_remote_addr zone=submit:20m rate=20r/s;

limit_conn_zone $binary_remote_addr zone=perip:10m;

server {
    listen 80;
    server_name _;
    server_tokens off;

    limit_conn perip 20;

    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options DENY;

    proxy_connect_timeout  5s;
    proxy_read_timeout    15s;
    proxy_send_timeout    10s;

    # /api/start — très limité (anti-flood de sessions)
    location = /api/start {
        limit_req zone=start burst=3 nodelay;
        limit_req_status 429;
        proxy_pass         http://app:8000;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    }

    # /api/puzzle/{id}/submit — limite modérée (une soumission par puzzle)
    location ~ ^/api/puzzle/[0-9]+/submit$ {
        limit_req zone=submit burst=12 nodelay;
        limit_req_status 429;
        proxy_pass         http://app:8000;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    }

    # /api/* — limite générale
    location /api/ {
        limit_req zone=api burst=60 nodelay;
        limit_req_status 429;
        proxy_pass         http://app:8000;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    }

    # Interface HTML
    location / {
        proxy_pass       http://app:8000;
        proxy_set_header Host            $host;
        proxy_set_header X-Real-IP       $remote_addr;
    }

    # Healthcheck interne nginx
    location /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}
